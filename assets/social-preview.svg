<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CAD Guardian AutoCAD AutoLISP .NET proof repo preview</title>
  <desc id="desc">Branded social preview for the CAD Guardian AutoCAD AutoLISP .NET proof repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.48" stop-color="#0b1524"/>
      <stop offset="1" stop-color="#10201b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142238"/>
      <stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 118H1280" stroke="#38bdf8" stroke-opacity="0.18"/>
  <path d="M0 522H1280" stroke="#22c55e" stroke-opacity="0.2"/>
  <path d="M100 0V640M1180 0V640" stroke="#ffffff" stroke-opacity="0.06"/>

  <g transform="translate(82 76)">
    <rect x="0" y="0" width="1116" height="488" rx="22" fill="url(#panel)" stroke="#e2e8f0" stroke-opacity="0.18" filter="url(#shadow)"/>
    <rect x="34" y="34" width="92" height="92" rx="14" fill="#020617" stroke="#38bdf8" stroke-opacity="0.55"/>
    <path d="M80 50L110 67V101L80 118L50 101V67Z" fill="none" stroke="#22c55e" stroke-width="6" stroke-linejoin="round"/>
    <path d="M66 80H95M66 94H88" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <text x="148" y="70" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">CAD GUARDIAN</text>
    <text x="148" y="110" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">AutoCAD AutoLISP .NET service lane</text>

    <text x="34" y="210" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="850" letter-spacing="0">
      AutoCAD AutoLISP .NET
    </text>
    <text x="34" y="286" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="850" letter-spacing="0">
      Proof Repo
    </text>

    <rect x="34" y="328" width="674" height="76" rx="12" fill="#020617" stroke="#22c55e" stroke-opacity="0.62"/>
    <text x="58" y="360" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" letter-spacing="1.4">PROOF DECISION</text>
    <text x="58" y="388" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">AutoLISP command, AutoCAD .NET adapter, or private-sample pass</text>

    <rect x="746" y="178" width="318" height="226" rx="14" fill="#020617" stroke="#e2e8f0" stroke-opacity="0.16"/>
    <text x="774" y="222" fill="#f59e0b" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" letter-spacing="1.4">RUN COMMAND</text>
    <text x="774" y="271" fill="#bbf7d0" font-family="SFMono-Regular, Consolas, monospace" font-size="28">npm run demo</text>
    <path d="M774 304H1036" stroke="#e2e8f0" stroke-opacity="0.16"/>
    <text x="774" y="344" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">writes reports/</text>
    <text x="774" y="376" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="650">quickstart-report.json</text>

    <g transform="translate(34 432)">
      <rect width="190" height="34" rx="17" fill="#13233a" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="18" y="23" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750">Layer/entity inventory</text>
      <rect x="208" width="204" height="34" rx="17" fill="#13233a" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="226" y="23" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750">Text/title-block surface</text>
      <rect x="430" width="194" height="34" rx="17" fill="#13233a" stroke="#38bdf8" stroke-opacity="0.32"/>
      <text x="448" y="23" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750">DWG runtime gate</text>
    </g>
